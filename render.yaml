services:
  - type: web
    name: wsm-inventory
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        value: winshape1984
      - key: TURSO_DATABASE_URL
        value: libsql://wsm-inventory-rphilo.aws-us-east-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
